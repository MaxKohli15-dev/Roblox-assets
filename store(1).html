<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roblox Asset Store</title>
<style>
  :root {
    --bg:#0e0f13; --card:#191b22; --line:#262933;
    --text:#e7e9ee; --muted:#8b90a0; --accent:#5865f2; --green:#3ba55d;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(14,15,19,.85); backdrop-filter:blur(8px); z-index:10; }
  .brand { font-weight:700; font-size:18px; } .brand span { color:var(--accent); }
  .userbox { display:flex; align-items:center; gap:10px; font-size:14px; } .userbox img { width:30px; height:30px; border-radius:50%; }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-weight:600; transition:.15s; }
  .btn-primary { background:var(--accent); color:#fff; } .btn-primary:hover { filter:brightness(1.1); }
  .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-get { background:var(--green); color:#fff; width:100%; } .btn-get:hover { filter:brightness(1.1); }
  main { max-width:1100px; margin:0 auto; padding:32px 24px 80px; }
  h2 { font-size:22px; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .card .thumb { aspect-ratio:16/10; background:#101218 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .card .body { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card h3 { font-size:16px; } .card p { font-size:13px; color:var(--muted); flex:1; }
  .price { font-weight:700; font-size:16px; color:var(--muted); }
  .got-tag { background:rgba(59,165,93,.15); color:var(--green); font-size:12px; padding:6px 10px; border-radius:6px; text-align:center; font-weight:600; }
  .got-tag a { color:var(--green); }
  .del { align-self:flex-start; background:transparent; color:#e0576f; font-size:12px; padding:4px 0; }
  .admin-panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:34px; }
  .admin-panel h2 { font-size:17px; margin-bottom:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .form-grid .full { grid-column:1/-1; }
  input,textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; font:inherit; }
  textarea { resize:vertical; min-height:60px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .empty { color:var(--muted); text-align:center; padding:60px 0; }
  .hidden { display:none; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="brand">Roblox <span>Assets</span></div>
  <div class="userbox" id="userbox"></div>
</header>

<main>
  <div class="admin-panel hidden" id="adminPanel">
    <h2>➕ Asset hinzufügen (Admin)</h2>
    <div class="form-grid">
      <div class="full"><label>Titel</label><input id="f-title" placeholder="z.B. Modern Shop GUI" /></div>
      <div class="full"><label>Beschreibung</label><textarea id="f-desc" placeholder="Kurze Beschreibung"></textarea></div>
      <div><label>Preis-Text (nur Anzeige, z.B. „Gratis" oder „100 Robux")</label><input id="f-price" placeholder="Gratis" /></div>
      <div><label>Bild-URL (optional)</label><input id="f-image" placeholder="https://..." /></div>
      <div class="full"><label>Download-/Asset-Link</label><input id="f-download" placeholder="https://..." /></div>
      <div class="full"><button class="btn-primary" onclick="addAsset()">Speichern</button></div>
    </div>
    <div class="row">
      <button class="btn-ghost" onclick="exportAssets()">📤 Assets exportieren</button>
      <button class="btn-ghost" onclick="importAssets()">📥 Assets importieren</button>
    </div>
    <p class="note">Tipp: Mit „exportieren" bekommst du deine Assets als Text. Diesen Text in <b>DEFAULT_ASSETS</b> im Quelltext einsetzen, dann sehen ihn alle Besucher.</p>
  </div>

  <div class="admin-panel hidden" id="gate" style="text-align:center;"></div>

  <h2 id="storeTitle">Store</h2>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">Noch keine Assets vorhanden.</div>
</main>

<script>
/* =================== KONFIGURATION =================== */
// Deine Discord Application Client-ID (Developer Portal -> OAuth2 -> Client ID).
// Ohne die funktioniert der Login nicht. Client-ID ist NICHT geheim.
const DISCORD_CLIENT_ID = "1538208123159052388";

// Nur diese Discord-ID ist Admin:
const ADMIN_DISCORD_ID = "1440385339377188884";

// Man muss auf DIESEM Discord-Server sein, sonst kein Zugriff auf die Assets.
// Server-ID: in Discord Entwicklermodus an -> Rechtsklick auf Server -> "Server-ID kopieren".
const GUILD_ID = "1538537152202412164";
// Einladungslink zum Server (für Leute, die noch nicht drauf sind):
const INVITE_URL = "https://discord.gg/BSc9DRWRxv";

// Discord-Webhook deines Channels (Meldung "X hat Y geholt").
// ACHTUNG: steht im Quelltext -> für jeden sichtbar. Bei Missbrauch neu erstellen.
const WEBHOOK_URL = "https://discord.com/api/webhooks/1538537425918238732/Bs1hfi5ugIvjJfDRFZZbvFMr4QOhYDdXjMj67j8VDYxUeBnfVmaeoHwMav-U6sGtSUcj";

// Vorgegebene Assets, die JEDER sieht (per Export/Import befüllen):
const DEFAULT_ASSETS = [
  // { id:1, title:"Beispiel GUI", description:"Beschreibung", price:"Gratis", image_url:"", download_url:"https://..." }
];
/* ==================================================== */

const REDIRECT_URI = location.origin + location.pathname;
let user = null;
let isMember = false;

const store = {
  load() { try { return JSON.parse(localStorage.getItem("assets")) || null; } catch { return null; } },
  save(a) { localStorage.setItem("assets", JSON.stringify(a)); },
};
let assets = store.load() || DEFAULT_ASSETS.slice();
const got = () => { try { return JSON.parse(localStorage.getItem("got")) || []; } catch { return []; } };
const isAdmin = () => user && user.id === ADMIN_DISCORD_ID;
const esc = (s) => (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Discord Login (Implicit Grant, ohne Server) ---------- */
function login() {
  const u = new URL("https://discord.com/oauth2/authorize");
  u.searchParams.set("client_id", DISCORD_CLIENT_ID);
  u.searchParams.set("redirect_uri", REDIRECT_URI);
  u.searchParams.set("response_type", "token");
  u.searchParams.set("scope", "identify guilds");
  u.searchParams.set("prompt", "none");
  location.href = u.toString();
}
function logout() { localStorage.removeItem("discordUser"); user = null; render(); }

async function handleAuthRedirect() {
  const saved = localStorage.getItem("discordUser");
  if (saved) { const s = JSON.parse(saved); user = s.user; isMember = s.isMember; return; }
  if (location.hash.includes("access_token")) {
    const p = new URLSearchParams(location.hash.slice(1));
    const token = p.get("access_token");
    history.replaceState({}, "", REDIRECT_URI);
    if (token) {
      const r = await fetch("https://discord.com/api/users/@me", { headers:{ Authorization:"Bearer "+token } });
      const d = await r.json();
      user = { id:d.id, username:d.username,
        avatar:d.avatar ? `https://cdn.discordapp.com/avatars/${d.id}/${d.avatar}.png` : null };
      // Server-Mitgliedschaft prüfen
      try {
        const gr = await fetch("https://discord.com/api/users/@me/guilds", { headers:{ Authorization:"Bearer "+token } });
        const guilds = await gr.json();
        isMember = Array.isArray(guilds) && guilds.some(g => g.id === GUILD_ID);
      } catch { isMember = false; }
      localStorage.setItem("discordUser", JSON.stringify({ user, isMember }));
    }
  }
}

/* ---------- Render ---------- */
function render() {
  const box = document.getElementById("userbox");
  if (user) {
    box.innerHTML = `${user.avatar?`<img src="${user.avatar}">`:""}
      <span>${esc(user.username)}${isAdmin()?" • Admin":""}</span>
      <button class="btn-ghost" onclick="logout()">Logout</button>`;
  } else {
    box.innerHTML = `<button class="btn-primary" onclick="login()">Mit Discord anmelden</button>`;
  }
  document.getElementById("adminPanel").classList.toggle("hidden", !(isAdmin() && isMember));

  const g = document.getElementById("grid"), owned = got();
  const gate = document.getElementById("gate");
  const hasAccess = user && isMember;

  // Kein Zugriff -> Gate zeigen, Store verstecken
  if (!hasAccess) {
    document.getElementById("empty").classList.add("hidden");
    g.innerHTML = "";
    if (!user) {
      gate.innerHTML = `<h2>🔒 Zugriff gesperrt</h2>
        <p>Melde dich mit Discord an, um auf die Assets zuzugreifen.</p>
        <button class="btn-primary" onclick="login()">Mit Discord anmelden</button>`;
    } else {
      gate.innerHTML = `<h2>🔒 Erst dem Server beitreten</h2>
        <p>Du musst Mitglied unseres Discord-Servers sein, um Assets zu holen.</p>
        <div class="row">
          <button class="btn-primary" onclick="window.open(INVITE_URL,'_blank')">Server beitreten</button>
          <button class="btn-ghost" onclick="login()">Ich bin beigetreten — neu prüfen</button>
        </div>`;
    }
    gate.classList.remove("hidden");
    document.getElementById("storeTitle").classList.add("hidden");
    return;
  }
  gate.classList.add("hidden");
  document.getElementById("storeTitle").classList.remove("hidden");

  document.getElementById("empty").classList.toggle("hidden", assets.length>0);
  g.innerHTML = assets.map(a => {
    const has = owned.includes(a.id);
    return `<div class="card">
      <div class="thumb" style="${a.image_url?`background-image:url('${a.image_url}')`:""}">${a.image_url?"":"Kein Bild"}</div>
      <div class="body">
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.description||"")}</p>
        <div class="price">${esc(a.price||"Gratis")}</div>
        ${has
          ? `<div class="got-tag">✓ Geholt — <a href="${a.download_url}" target="_blank">Download</a></div>`
          : `<button class="btn-get" onclick="get(${a.id})">Holen</button>`}
        ${isAdmin()?`<button class="del" onclick="delAsset(${a.id})">löschen</button>`:""}
      </div></div>`;
  }).join("");
}

/* ---------- Aktionen ---------- */
async function get(id) {
  if (!user) return alert("Bitte zuerst mit Discord anmelden.");
  const a = assets.find(x => x.id === id); if (!a) return;
  const owned = got();
  if (!owned.includes(id)) { owned.push(id); localStorage.setItem("got", JSON.stringify(owned)); }
  try {
    await fetch(WEBHOOK_URL, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ content:`✅ **${user.username}** hat **${a.title}** geholt` }),
    });
  } catch(e) { console.error("Webhook fehlgeschlagen", e); }
  render();
}

function addAsset() {
  const title = document.getElementById("f-title").value.trim();
  const download = document.getElementById("f-download").value.trim();
  if (!title || !download) return alert("Titel und Download-Link sind Pflicht.");
  assets.unshift({
    id: Date.now(),
    title,
    description: document.getElementById("f-desc").value.trim(),
    price: document.getElementById("f-price").value.trim() || "Gratis",
    image_url: document.getElementById("f-image").value.trim(),
    download_url: download,
  });
  store.save(assets);
  ["f-title","f-desc","f-price","f-image","f-download"].forEach(i=>document.getElementById(i).value="");
  render();
}
function delAsset(id) { if(!confirm("Wirklich löschen?"))return; assets=assets.filter(a=>a.id!==id); store.save(assets); render(); }

function exportAssets() {
  const txt = JSON.stringify(assets, null, 2);
  navigator.clipboard?.writeText(txt);
  prompt("Kopiert! Diesen Text in DEFAULT_ASSETS im Quelltext einsetzen:", txt);
}
function importAssets() {
  const txt = prompt("Assets-Text (JSON) einfügen:");
  if (!txt) return;
  try { assets = JSON.parse(txt); store.save(assets); render(); }
  catch { alert("Ungültiges Format."); }
}

/* ---------- Start ---------- */
(async () => { await handleAuthRedirect(); render(); })();
</script>
</body>
</html>
